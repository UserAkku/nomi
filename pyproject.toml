[project]
name = "nomi"
version = "0.1.0"
description = "Evidence-based triage for GitHub issues and pull requests: verifies technical claims against the repository using a local open-weight model."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Akhilesh Kumar" }]
requires-python = ">=3.11"
keywords = ["github-app", "triage", "open-source", "llm", "ollama", "verification"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Quality Assurance",
  "Environment :: Console",
]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "typer>=0.12",
  "rich>=13.7",
  "rapidfuzz>=3.9",
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pyjwt[crypto]>=2.9",
]

[project.scripts]
nomi = "nomi.cli:app"

[project.urls]
Repository = "https://github.com/UserAkku/nomi"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "respx>=0.21",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nomi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers -p no:cacheprovider"
filterwarnings = [
  # starlette's TestClient nags about httpx; irrelevant to our code
  "ignore::DeprecationWarning:fastapi.testclient",
  "ignore:Using `httpx` with `starlette.testclient`",
]
markers = [
  "docker: needs a running Docker daemon (skipped automatically when absent)",
  "ollama: needs a running Ollama server with the configured model (skipped automatically when absent)",
]

[tool.coverage.run]
source = ["nomi"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# example inputs are reporters' code, not ours
extend-exclude = ["examples/*/repo"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501", "RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B011", "SIM117"]
